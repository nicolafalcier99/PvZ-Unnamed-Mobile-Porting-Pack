name: CI build

# Build checks for the platforms this fork supports (Linux, macOS, Android), plus the unit tests.
# Nothing is published from here: the APK on the Releases page is built and signed separately.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (Arch, x86_64) build and tests
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
    - uses: actions/checkout@v6

    - name: Check out the data pack
      uses: actions/checkout@v6
      with:
        repository: nicolafalcier99/PvZ-Unnamed-Mobile-Porting-Pack-Data
        path: pvz-unnamed-pack

    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm cmake libjpeg-turbo libopenmpt libpng ninja python sdl3 sdl3_mixer sudo
        useradd -m builder
        chown -R builder:builder .

    - name: Build and test
      run: |
        sudo -u builder bash -lc '
          set -e
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          PVZU_PACK_DIR="$PWD/pvz-unnamed-pack" SDL_AUDIO_DRIVER=dummy ./build/tests/pvzu_tests
          python3 -m unittest discover -s tools/tests -t .
        '

  build-macos:
    name: macOS (arm64) build and tests
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6

    - name: Check out the data pack
      uses: actions/checkout@v6
      with:
        repository: nicolafalcier99/PvZ-Unnamed-Mobile-Porting-Pack-Data
        path: pvz-unnamed-pack

    - name: Install dependencies
      run: brew install cmake jpeg-turbo libopenmpt libpng ninja sdl3 sdl3_mixer

    - name: Build and test
      run: |
        cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        PVZU_PACK_DIR="$PWD/pvz-unnamed-pack" SDL_AUDIO_DRIVER=dummy ./build/tests/pvzu_tests

  build-android:
    name: Android (arm64-v8a) build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Use the runner's NDK
      run: |
        NDK_DIR="$ANDROID_NDK_LATEST_HOME"
        echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
        NDK_VER=$(grep -oP 'Pkg\.Revision = \K[\d.]+' "$NDK_DIR/source.properties" || echo unknown)
        echo "VCPKG_TC=ndk-$NDK_VER" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      with:
        path: vcpkg-cache
        key: vcpkg-android-${{ env.VCPKG_TC }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMake/triplets/arm64-android.cmake') }}
        restore-keys: |
          vcpkg-android-${{ env.VCPKG_TC }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
      env:
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build APK (debug)
      env:
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle wrapper
        ./gradlew assembleDebug --no-daemon
